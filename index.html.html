<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Team DNA — Project Chaos!</title><style>
:root{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#25214d;background:#f4efff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,#ffe1ef,transparent 35%),radial-gradient(circle at 95% 5%,#d8f5ff,transparent 35%),#f4efff}.wrap{max-width:780px;margin:auto;padding:15px 14px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}.brand{font-weight:1000;font-size:18px;letter-spacing:-.04em;color:#6141b6}.chip{border:2px solid #bba9e8;background:#fff;border-radius:30px;padding:10px 13px;color:#382c70;font-weight:900;cursor:pointer}.panel{background:#fffdfb;border:3px solid #3a2c74;border-radius:27px;overflow:hidden;box-shadow:6px 8px 0 #d6c9f4}.hero{background:linear-gradient(125deg,#d6f4ff,#fce0ed);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:235px}.hero img{display:block;width:100%;height:260px;object-fit:cover;object-position:center 40%}.hero.cover img{height:365px;object-fit:cover;object-position:center 44%}.hero.resultart img{height:310px;object-fit:cover}.hero:after{content:'✦  ✧';position:absolute;right:18px;top:12px;color:white;font-size:23px;text-shadow:0 2px #b5a3dd}.content{padding:clamp(18px,4vw,32px)}h1,h2{letter-spacing:-.045em;line-height:1.12;margin:10px 0 14px}h1{font-size:clamp(31px,6vw,43px)}h2{font-size:clamp(25px,5vw,34px)}h3{font-size:18px}p{color:#5d5877;line-height:1.6}.eyebrow{color:#7750c6;font-size:12px;font-weight:1000;text-transform:uppercase;letter-spacing:.11em}.btn{border:2px solid #382969;border-radius:16px;padding:14px 19px;font-size:16px;font-weight:1000;background:#754be2;color:#fff;box-shadow:3px 4px 0 #382969;cursor:pointer}.btn.secondary{background:white;color:#382969}.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 #382969}.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:23px}.field{border:2px solid #c9b7f1;border-radius:13px;width:100%;padding:14px;font:inherit;margin:8px 0 16px}.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.avatar{border:3px solid #eadcfb;border-radius:15px;background:#fbf5ff;padding:12px 2px;font-size:37px;cursor:pointer}.avatar.sel{background:#f0e3ff;border-color:#8057e6}.progress{height:12px;background:#eee7fb;border:2px solid #3a2c74;border-radius:40px;overflow:hidden;margin:12px 0 19px}.fill{height:100%;background:linear-gradient(90deg,#ffb866,#8358e6);transition:width .3s}.options{display:grid;gap:11px;margin-top:20px}.option{display:flex;align-items:center;text-align:left;gap:12px;width:100%;padding:15px;border:2px solid #dfd0f4;background:#faf6ff;color:#28204e;border-radius:15px;font:inherit;font-weight:800;line-height:1.4;cursor:pointer}.option:hover,.option:focus-visible{border-color:#7952dd;background:#f1e9ff}.letter{display:grid;place-items:center;flex:0 0 31px;height:31px;border-radius:9px;background:#e4d8ff}.reaction{background:#fff1d5;border:2px solid #ffcb79;border-radius:17px;padding:18px;margin-top:18px}.reaction h3{margin:0 0 7px}.reaction p{margin:0}.result{border:2px solid #e8d5ff;border-radius:20px;background:linear-gradient(160deg,#fff1df,#f7ebff,#e3fcf7);padding:20px;text-align:center}.mascot{font-size:64px}.cardlet{background:#fff;border:2px solid #e4d7f8;border-radius:14px;padding:15px;margin-top:12px;text-align:left}.cardlet p{margin:6px 0}.bars{display:grid;gap:12px;margin-top:19px}.barline{display:flex;justify-content:space-between;font-size:13px;font-weight:850}.track{background:#e9e3f4;border-radius:20px;height:10px;overflow:hidden}.bar{height:100%;border-radius:20px}.muted,.footer{font-size:12px;color:#706d89}.footer{text-align:center;margin:25px 0}.pill{display:inline-block;background:#ffdd8f;border-radius:25px;padding:8px 12px;font-size:12px;font-weight:900}.story{font-size:16px}.choice-quote{background:#fff;border:2px solid #ded1f4;border-radius:15px;padding:14px;font-weight:850}.confetti{text-align:center;font-size:28px;letter-spacing:10px}.trio{font-size:17px;background:#e8fcf6;border:2px solid #86dcca;border-radius:16px;padding:18px}.animate{animation:up .35s ease-out}@keyframes up{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:480px){.wrap{padding:10px 10px 38px}.panel{border-radius:20px;box-shadow:4px 5px 0 #d6c9f4}.hero img{height:205px}.hero.cover img{height:290px}.hero.resultart img{height:255px}.content{padding:18px}.brand{font-size:14px}.chip{font-size:12px;padding:8px}.option{padding:13px}.avatar{font-size:31px}}@media print{.top,.buttons,.footer{display:none!important}body{background:#fff}.panel{box-shadow:none}.wrap{max-width:700px}.hero{max-height:210px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">✦ TEAM DNA / PROJECT CHAOS</div><button class="chip" id="sound" aria-label="Toggle background music">🔇 Music off</button></header><section class="panel" id="app" aria-live="polite"></section><div class="footer">✨ Made for classroom fun · No accounts · No tracking · Works offline</div></main><script>const profiles=[{name:'The Driver',emoji:'🚀',title:'The Mission Commander',power:'You turn confusion into action. When everyone is wondering what to do, you help the team move forward.',blind:'You may rush ahead before everyone has had a chance to contribute.',tip:'Ask for input before making the call, especially when the team is under pressure.',color:'#f2c17c'},{name:'The Innovator',emoji:'💡',title:'The Idea Alchemist',power:'You find unexpected possibilities and help your team escape the same old solutions.',blind:'Your brilliant ideas can sometimes outgrow the time and resources available.',tip:'Pair your boldest ideas with one practical next step.',color:'#d7baff'},{name:'The Connector',emoji:'🤝',title:'The Team Heart',power:'You notice how people feel and help everyone find a way to contribute.',blind:'You might put off uncomfortable conversations to preserve harmony.',tip:'Kindness and honest accountability can go hand in hand.',color:'#f8bdd3'},{name:'The Analyst',emoji:'🔍',title:'The Clue Detective',power:'You ask smart questions, spot hidden risks, and help the team make decisions based on evidence.',blind:'You may keep researching when it is already time to act.',tip:'Decide what information is essential, then move forward.',color:'#a6e4df'}];
const scenes=[
{title:'The Awkward First Meeting',art:'🫣',mini:'☕',story:'Welcome to Project Chaos! Your new teammates sit in total silence. Someone coughs. A chair squeaks. This is getting painful.',q:'How do you break the silence?',opts:['Suggest a quick plan and get everyone started.','Throw out a weird, fun icebreaker idea.','Ask everyone how they feel about the project.','Ask what we actually know about the assignment.'],react:['And just like that, the meeting has an agenda.','Nobody expected a team mascot contest, but here we are.','The room finally relaxes. Even the squeaky chair.','The mystery brief is about to meet its match.']},
{title:'The Million-Dollar Brief',art:'🧩',mini:'💰',story:'Your client announces: “Make something revolutionary!” Then leaves without explaining what “something” means. Classic.',q:'What is your first move?',opts:['Set a short meeting to agree on deliverables.','Brainstorm wild possibilities without limits.','Check what each teammate is excited to work on.','Write down assumptions and questions for the client.'],react:['A plan appears out of thin air. Impressive.','Your whiteboard now contains a flying spreadsheet.','Everyone has a voice in the mission.','You have already identified seven missing requirements.']},
{title:'The Great Team Debate',art:'💥',mini:'💬',story:'Two teammates have opposite ideas. Both insist theirs is the only sensible option. The group chat is typing… typing… typing…',q:'What do you do?',opts:['Help the team choose and move forward.','Suggest combining the strongest parts of both ideas.','Let both people explain their concerns calmly.','Compare both ideas against clear criteria.'],react:['The debate finally has a finish line.','A surprise third option enters the chat.','The temperature drops by ten degrees.','The evidence has entered the conversation.']},
{title:'The Spreadsheet of Doom',art:'📊',mini:'😵',story:'A file named FINAL_final_v8_REAL.xlsx arrives. It contains 14 tabs, mysterious colours, and absolutely no instructions.',q:'How do you tackle it?',opts:['Assign tabs to teammates and set a deadline.','Look for a faster way to visualise the information.','Ask who feels comfortable with data and pair people up.','Check the data structure, missing values and definitions.'],react:['The spreadsheet has officially been divided and conquered.','Suddenly the data might become a dashboard.','Nobody has to face Excel alone today.','Those suspicious blank cells have been spotted.']},
{title:'The Disappearing Teammate',art:'👻',mini:'📱',story:'A teammate has vanished from the group chat for 48 hours. Their section is missing. The deadline is coming.',q:'What is your response?',opts:['Reassign urgent tasks so the team can continue.','Find an alternative approach to cover the missing work.','Check privately whether the teammate is okay.','Review exactly what is missing before deciding.'],react:['Mission Control activated.','Plan B, C and D have entered the chat.','Empathy mode activated.','Detective mode activated.']},
{title:'The AI Temptation',art:'🤖',mini:'✨',story:'Someone suggests pasting all your project information into an AI tool. “It will do everything in ten minutes!” they say.',q:'How would you respond?',opts:['Set clear rules for what AI can and cannot do.','Explore safe ways AI could speed up brainstorming.','Discuss concerns so everyone is comfortable with the approach.','Check accuracy, confidentiality and permitted usage first.'],react:['The team now has boundaries, not just enthusiasm.','The robot may help, but it is not the project manager.','Everyone gets a say before the bot gets a prompt.','Your confidential files breathe a sigh of relief.']},
{title:'The Client Plot Twist',art:'🌪️',mini:'📋',story:'After weeks of work, your client announces a “tiny change.” It requires rebuilding half the project. Tiny, apparently.',q:'What do you do first?',opts:['Reprioritise tasks and reset the timeline.','Find a clever way to reuse existing work.','Help everyone process the change and regroup.','Assess the impact and clarify the revised scope.'],react:['A revised action plan is already taking shape.','Nothing goes to waste on your watch.','Team morale survives the plot twist.','Scope creep has been caught on camera.']},
{title:'The Midnight Deadline',art:'⏰',mini:'🌙',story:'It is 11:47 PM. Submission is at midnight. One slide is blank. Someone is eating chips loudly. The laptop fan sounds like a helicopter.',q:'What is your priority?',opts:['Give everyone one final task and count down.','Create a simple but memorable replacement slide.','Keep the group calm and check who needs help.','Fix the most serious errors before submitting.'],react:['Thirteen minutes. One mission. Go!','The replacement slide might actually be better.','Panic level reduced from 100 to 62.','Critical errors eliminated. The fan remains dramatic.']},
{title:'The Presentation Plot Twist',art:'🎤',mini:'😳',story:'Halfway through the presentation, your teammate freezes. The client asks a difficult question. Everyone looks at everyone else.',q:'How do you help?',opts:['Step in and steer the presentation forward.','Use an example or analogy to explain the idea.','Support your teammate and help them regain confidence.','Clarify the question and respond with evidence.'],react:['The presentation is back on track.','A brilliant analogy saves the day.','Your teammate remembers how to breathe.','A thoughtful answer beats a rushed guess.']},
{title:'The Final Team Verdict',art:'🏆',mini:'🎉',story:'Against all odds, Project Chaos is complete! Your team survives. The client smiles. The printer finally stops making strange noises.',q:'What matters most as you wrap up?',opts:['Celebrate achieving the goal and plan what comes next.','Reflect on the most original ideas you created.','Thank everyone and celebrate the team effort.','Review lessons learned and what could improve.'],react:['Next mission? You are already ready.','The best ideas deserve a sequel.','The real victory is the team you built.','Every mission leaves clues for the next one.']}];

const consequences=[["You sketch a quick plan on the board. Everyone finally has something to react to, and the quiet room begins to buzz with ideas.", "You propose that everyone invent a ridiculous team name. Someone suggests “The Spreadsheet Avengers”. Laughter breaks the ice, and introductions suddenly feel easier.", "You invite everyone to share how they are feeling. One teammate admits they are nervous, and others realise they are not alone.", "You ask what the assignment actually requires. The group uncovers a few assumptions and starts asking much better questions."], ["You organise a quick planning huddle. The team leaves with a draft timeline and a clearer sense of direction.", "You fill the whiteboard with possibilities, including one outrageous idea that sparks a surprisingly practical solution.", "You ask what everyone would enjoy contributing. Quiet teammates begin volunteering their strengths.", "You make a list of unanswered questions. The team realises a short client clarification could save days of wasted work."], ["You guide everyone toward a decision. The team agrees on a direction and can finally start building.", "You connect the best parts of both proposals. The new approach is something neither teammate considered alone.", "You let each person explain their reasoning. The argument becomes a productive conversation rather than a competition.", "You compare both proposals against the brief. The team discovers which trade-offs really matter."], ["You divide the spreadsheet into manageable tasks. The intimidating file becomes a shared mission.", "You imagine a visual dashboard. Suddenly the numbers feel like a story the team could tell.", "You pair confident spreadsheet users with classmates who want to learn. Everyone contributes and picks up a skill.", "You check the column definitions and spot inconsistent entries. The team avoids drawing conclusions from messy data."], ["You redistribute the urgent tasks and keep the project moving, while making sure someone follows up with the missing teammate.", "You develop an alternative approach that keeps the deliverable achievable despite the missing section.", "You message your teammate privately. It turns out they have been dealing with something difficult, and the team can respond more thoughtfully.", "You audit the missing section and identify the critical gaps. The team can act on facts rather than assumptions."], ["You set clear boundaries for AI use. The team has a practical plan that protects the quality of its work.", "You experiment with AI for brainstorming and outlining, while keeping the final judgement with the team.", "You invite everyone to voice concerns. The group agrees on an approach that everyone understands.", "You check privacy, accuracy and permitted usage. The team catches a risky idea before any confidential information is shared."], ["You reset priorities and give everyone a new action plan. The team can see a way forward.", "You find clever ways to reuse earlier work. The change becomes less disastrous than it first seemed.", "You acknowledge the frustration and bring the team together. People feel heard and ready to regroup.", "You clarify the revised scope and its implications. The team avoids committing to an impossible timeline."], ["You assign a final task to each person. The team works together with surprising focus until the upload is complete.", "You redesign the missing slide into one memorable visual. It communicates more clearly than the original plan.", "You keep everyone calm and check who needs support. The team stays coordinated rather than spiralling into panic.", "You prioritise the errors that could damage the submission. The final version is cleaner and more defensible."], ["You step in smoothly and guide the presentation forward. Your teammate has a moment to recover.", "You explain the difficult point using a simple analogy. The client nods: the idea finally clicks.", "You support your teammate with a gentle prompt. They regain confidence and finish their part.", "You clarify what the client is asking and answer with evidence. The response feels thoughtful and credible."], ["You celebrate the milestone and think about what comes next. Your team ends on a sense of achievement.", "You highlight the creative risks that paid off. The team leaves inspired to keep experimenting.", "You thank each person for their contribution. Everyone feels recognised for the part they played.", "You reflect on what worked and what could improve. The next project will benefit from what you learned."]];

let state={page:'home',name:'',avatar:'🦊',index:0,answers:[],chosen:null,sound:false};
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let audioCtx=null,musicTimer=null,step=0;
function tone(freq,at,duration=.19,volume=.025,type='sine'){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,at);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(volume,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(g);g.connect(audioCtx.destination);o.start(at);o.stop(at+duration+.02)}
function musicBeat(){if(!state.sound||!audioCtx)return;const notes=[392,493.88,587.33,493.88,440,523.25,659.25,523.25,349.23,440,523.25,440,392,493.88,587.33,493.88];let t=audioCtx.currentTime+.03;const n=notes[step%notes.length];tone(n,t,.29,.018,'triangle');if(step%4===0)tone(n/2,t,.55,.012,'sine');step++}
function setSound(on){state.sound=on;document.getElementById('sound').textContent=on?'🎵 Music on':'🔇 Music off';if(on){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();musicBeat();musicTimer=setInterval(musicBeat,350)}catch(e){state.sound=false;document.getElementById('sound').textContent='🔇 Music unavailable'}}else{clearInterval(musicTimer);musicTimer=null}}
function clickTone(){if(state.sound&&audioCtx)tone(784,audioCtx.currentTime,.13,.04,'sine')}
function imageFor(page,index=0){let a=page==='home'?'cover':page==='setup'?'setup':page==='reaction'?'reaction':page==='result'?'driver':page==='trio'?'trio':index===5?'ai':'question';return `<div class="hero ${page==='home'?'cover':page==='result'?'resultart':''}"><img src="${artwork[a]}" alt="Cute cartoon project teammates in a colourful adventure" /></div>`}
function render(){const s=state;
if(s.page==='home'){app.innerHTML=`${imageFor('home')}<div class="content animate"><div class="eyebrow">A mini adventure about teamwork</div><h1>Team DNA: Project Chaos! ✨</h1><p>You've joined a team with big dreams, mysterious deadlines and a group chat that's already on fire. Can you survive ten chaotic chapters?</p><p>Make choices, see what happens next, and discover your unique <b>Team DNA</b>.</p><span class="pill">🎮 10 chapters · About 10 minutes</span><div class="buttons"><button class="btn" id="start">Start adventure →</button></div></div>`;document.getElementById('start').onclick=()=>{clickTone();s.page='setup';render()};return}
if(s.page==='setup'){app.innerHTML=`${imageFor('setup')}<div class="content animate"><div class="eyebrow">Before the mission</div><h2>What should we call you?</h2><label for="nick"><b>Your adventure nickname</b></label><input class="field" id="nick" maxlength="28" placeholder="e.g. Captain Bubble Tea" value="${esc(s.name)}"><h3>Choose your adventure buddy 🐾</h3><div class="avatars">${['🦊','🐼','🐸','🐱','🐻','🐰','🦉','🐨'].map(a=>`<button class="avatar ${a===s.avatar?'sel':''}" data-a="${a}" aria-label="Choose ${a}">${a}</button>`).join('')}</div><div class="buttons"><button class="btn" id="go">Let's go! →</button><button class="btn secondary" id="back">← Back</button></div></div>`;document.getElementById('nick').oninput=e=>s.name=e.target.value;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{s.name=document.getElementById('nick').value;s.avatar=b.dataset.a;clickTone();render()});document.getElementById('go').onclick=()=>{s.name=document.getElementById('nick').value.trim()||'Mystery Teammate';s.page='game';clickTone();render()};document.getElementById('back').onclick=()=>{s.page='home';render()};return}
if(s.page==='game'){const q=scenes[s.index];app.innerHTML=`${imageFor('game',s.index)}<div class="content animate"><div class="eyebrow">Chapter ${s.index+1} of ${scenes.length} · ${esc(s.name)} ${s.avatar}</div><div class="progress"><div class="fill" style="width:${(s.index+1)/scenes.length*100}%"></div></div><h2>${q.title}</h2><p class="story">${q.story}</p><h3>${q.q}</h3><div class="options">${q.opts.map((o,i)=>`<button class="option" data-choice="${i}"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{s.chosen=Number(b.dataset.choice);s.answers[s.index]=s.chosen;s.page='reaction';clickTone();render();window.scrollTo(0,0)});return}
if(s.page==='reaction'){const q=scenes[s.index],c=s.chosen;app.innerHTML=`${imageFor('reaction')}<div class="content animate"><div class="eyebrow">Chapter ${s.index+1} · Your choice changed the story</div><div class="progress"><div class="fill" style="width:${(s.index+1)/scenes.length*100}%"></div></div><h2>✨ Nice move, ${esc(s.name)}!</h2><div class="choice-quote">${s.avatar} You chose: ${esc(q.opts[c])}</div><div class="reaction"><h3>📖 Here's what happened next...</h3><p>${consequences[s.index][c]}</p></div><p>${q.react[c]} Every team brings different strengths to the mission!</p><div class="buttons"><button class="btn" id="next">${s.index===scenes.length-1?'Unlock my Team DNA! ✨':'Continue to Chapter '+(s.index+2)+' →'}</button></div></div>`;document.getElementById('next').onclick=()=>{s.index++;s.chosen=null;s.page=s.index===scenes.length?'result':'game';clickTone();render();window.scrollTo(0,0)};return}
if(s.page==='result'){const scores=profiles.map((_,i)=>s.answers.filter(a=>a===i).length),max=Math.max(...scores),winners=scores.map((v,i)=>v===max?i:-1).filter(i=>i>=0),p=profiles[winners[0]],ties=winners.length>1;app.innerHTML=`${imageFor('result')}<div class="content animate"><div class="eyebrow">Mission complete · DNA unlocked</div><h1>🎉 You did it, ${esc(s.name)}!</h1><div class="result"><div class="eyebrow">Your Team DNA is...</div><div class="mascot">${p.emoji}</div><h2>${p.name}</h2><b>${p.title}</b>${ties?`<p class="pill">🌈 Hybrid DNA! Also tied with ${winners.slice(1).map(i=>profiles[i].name).join(' & ')}</p>`:''}<div class="cardlet"><b>⚡ Your superpower</b><p>${p.power}</p></div><div class="cardlet"><b>🌧️ Your kryptonite</b><p>${p.blind}</p></div><div class="cardlet"><b>🌱 Your growth quest</b><p>${p.tip}</p></div><div class="bars">${profiles.map((v,i)=>`<div><div class="barline"><span>${v.emoji} ${v.name}</span><span>${scores[i]} / 10</span></div><div class="track"><div class="bar" style="width:${scores[i]*10}%;background:${v.color}"></div></div></div>`).join('')}</div></div><p class="muted">A playful reflection of your choices, not a scientific personality assessment. You can have more than one working style.</p><div class="buttons"><button class="btn" id="trio">Final mission →</button><button class="btn secondary" id="print">🖨️ Save / print result</button></div></div>`;document.getElementById('trio').onclick=()=>{s.page='trio';clickTone();render()};document.getElementById('print').onclick=()=>window.print();return}
if(s.page==='trio'){app.innerHTML=`${imageFor('trio')}<div class="content animate"><div class="eyebrow">Final mission · Real-world multiplayer</div><h1>Find your missing pieces! 🧩</h1><p>Time to look up from your screen! Your final challenge is to <b>form a group of THREE classmates, each with a different Team DNA personality.</b></p><div class="trio">🧑‍🤝‍🧑 <b>Find two other people</b> whose Team DNA profiles are different from yours <em>and from each other</em>.</div><p>Once your trio is ready, look at the lecturer's screen for your next instructions. 👀</p><p class="muted">If you cannot find three distinct profiles, ask your lecturer for a creative alternative. All working styles are valuable.</p><div class="buttons"><button class="btn secondary" id="view">← My result</button><button class="btn" id="restart">↻ Play again</button></div></div>`;document.getElementById('view').onclick=()=>{s.page='result';render()};document.getElementById('restart').onclick=()=>{state={page:'home',name:'',avatar:'🦊',index:0,answers:[],chosen:null,sound:s.sound};render()};return}}
document.getElementById('sound').onclick=()=>setSound(!state.sound);render();
</script></body></html>
